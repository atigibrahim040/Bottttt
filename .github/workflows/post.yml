name: Post Video
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --no-deps "moviepy==2.2.1"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Monitor DMs and Post
        env:
          SESSION_PASSWORD: ${{ secrets.SESSION_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/post_video.py
